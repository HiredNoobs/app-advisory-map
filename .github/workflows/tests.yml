name: Tests

# Every branch, pull requests, and the release workflow (workflow_call) before it builds an image.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project with dev extras
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Run tests
        run: |
          pytest --cov=advisory_map --cov-fail-under=80

      - name: Run mypy
        run: |
          mypy src/advisory_map

      - name: Run flake8
        run: |
          flake8 src/advisory_map tests

      - name: Run isort
        run: |
          isort --check-only --diff src/advisory_map tests

      - name: Run black
        run: |
          black --check --diff src/advisory_map tests
